<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="320" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" />
  <g transform="translate(90, 20)">
          <!-- Rectangle Bottom -->
          <rect x="50" y="100" width="160" height="90" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="3" />
          <!-- Triangle Top -->
          <polygon points="50,100 210,100 130,30" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="3" />
          <!-- Triangle Height line -->
          <line x1="130" y1="30" x2="130" y2="100" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" />
          
          <text x="130" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">Rectangle (13 &#215; 9 cm)</text>
          <text x="130" y="70" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#10b981" font-weight="bold">Triangle (b = 13, h = 5 cm)</text>

          <text x="130" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">Total Area = Rect Area + Triangle Area</text>
          <text x="130" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#10b981" font-weight="bold">= (13 &#215; 9) + (&#189; &#215; 13 &#215; 5) = 117 + 32.5 = 149.5 cm&#178;</text>
        </g>
      
</svg>
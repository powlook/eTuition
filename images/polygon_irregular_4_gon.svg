<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <!-- Title Badge -->
  <rect x="16" y="16" width="328" height="32" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="180" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">
    Irregular Quadrilateral (4 Unequal Sides)
  </text>
  
  <!-- Polygon Outline -->
  <polygon points="70,90 300,70 260,270 50,220" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Vertices and Labels -->
  <circle cx="70" cy="90" r="4" fill="#f59e0b" />
    <circle cx="300" cy="70" r="4" fill="#f59e0b" />
    <circle cx="260" cy="270" r="4" fill="#f59e0b" />
    <circle cx="50" cy="220" r="4" fill="#f59e0b" />
  <text x="54" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">A</text>
    <text x="316" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">B</text>
    <text x="276" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">C</text>
    <text x="34" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">D</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    TV Screen Diagonal #46
  </text>

  <!-- Body Content -->
  
      <g transform="translate(100, 90)">
        <!-- TV Screen Outer -->
        <rect x="0" y="0" width="280" height="190" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="3" />
        <!-- Diagonal -->
        <line x1="0" y1="190" x2="280" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" />
        <!-- Labels -->
        <text x="140" y="212" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">Width = 40"</text>
        <text x="-40" y="100" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">Height = 30"</text>
        <text x="140" y="85" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#f59e0b" font-weight="bold">Diagonal = ? (50")</text>
      </g>
    
</svg>
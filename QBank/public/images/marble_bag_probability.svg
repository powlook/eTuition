<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="redMarble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="blueMarble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <radialGradient id="yellowMarble" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </radialGradient>
  </defs>
  <rect width="600" height="320" rx="16" fill="url(#bgBag)" stroke="#334155" stroke-width="2"/>
  
  <!-- Title -->
  <text x="300" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Marble Container Probability Experiment (Total = 10 Marbles)</text>
  
  <!-- Transparent Glass Jar Container -->
  <path d="M 120 100 Q 120 80 150 80 L 290 80 Q 320 80 320 100 L 330 250 Q 330 280 300 280 L 140 280 Q 110 280 110 250 Z" fill="#1e293b" fill-opacity="0.6" stroke="#94a3b8" stroke-width="3"/>
  <ellipse cx="220" cy="80" rx="85" ry="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- Glass Reflection Line -->
  <path d="M 135 110 Q 125 180 130 240" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 5 Red Marbles -->
  <circle cx="160" cy="245" r="18" fill="url(#redMarble)"/>
  <circle cx="210" cy="250" r="18" fill="url(#redMarble)"/>
  <circle cx="260" cy="245" r="18" fill="url(#redMarble)"/>
  <circle cx="185" cy="210" r="18" fill="url(#redMarble)"/>
  <circle cx="235" cy="210" r="18" fill="url(#redMarble)"/>
  
  <!-- 3 Blue Marbles -->
  <circle cx="150" cy="170" r="18" fill="url(#blueMarble)"/>
  <circle cx="200" cy="170" r="18" fill="url(#blueMarble)"/>
  <circle cx="250" cy="170" r="18" fill="url(#blueMarble)"/>
  
  <!-- 2 Yellow Marbles -->
  <circle cx="175" cy="130" r="18" fill="url(#yellowMarble)"/>
  <circle cx="225" cy="130" r="18" fill="url(#yellowMarble)"/>
  
  <!-- Right Card Panel: Probability Analysis -->
  <rect x="360" y="70" width="200" height="210" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Contents Breakdown</text>
  <line x1="375" y1="108" x2="545" y2="108" stroke="#334155" stroke-width="1"/>
  
  <text x="385" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#fca5a5">Red Marbles:</text>
  <text x="535" y="132" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#ef4444" text-anchor="end">5</text>
  
  <text x="385" y="157" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#93c5fd">Blue Marbles:</text>
  <text x="535" y="157" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#3b82f6" text-anchor="end">3</text>
  
  <text x="385" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#fef08a">Yellow Marbles:</text>
  <text x="535" y="182" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#eab308" text-anchor="end">2</text>
  
  <line x1="375" y1="195" x2="545" y2="195" stroke="#475569" stroke-width="1.5"/>
  <text x="385" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#fde047">P(Non-Blue):</text>
  <text x="535" y="215" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#34d399" text-anchor="end">7/10 (70%)</text>
  
  <text x="385" y="240" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">5 Red + 2 Yellow = 7</text>
  <text x="385" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#cbd5e1">Total Marbles = 10</text>
</svg>

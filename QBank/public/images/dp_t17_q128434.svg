  <!-- Header -->
  <text x="80" y="88" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">STEM</text>
  <text x="240" y="88" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">LEAF</text>
  <line x1="45" y1="95" x2="395" y2="95" stroke="rgba(255, 255, 255, 0.1)"/>

  <!-- Rows -->
  <text x="80" y="115" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">5</text>
  <text x="140" y="115" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">0  3  7  7  9</text>

  <text x="80" y="135" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">6</text>
  <text x="140" y="135" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">2  5  5  8</text>

  <text x="80" y="155" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">7</text>
  <text x="140" y="155" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700">1  4  4  8  9</text>

  <text x="80" y="175" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">8</text>
  <text x="140" y="175" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">0  3  6</text>

  <text x="380" y="185" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="end">Key: 5 | 2 = 52</text>

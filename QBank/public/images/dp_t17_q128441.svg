<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="440" height="240" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="12" y="12" width="416" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">MISLEADING GRAPH: TRUNCATED Y-AXIS DISTORTION</text>
  <text x="416" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">DATA & STATISTICAL ANALYSIS</text>

  <rect x="20" y="52" width="400" height="170" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Left Side: Truncated Axis (Misleading) -->
  <g transform="translate(30, 65)">
    <rect width="170" height="140" rx="6" fill="rgba(239, 68, 68, 0.1)" stroke="#ef4444" stroke-width="1"/>
    <text x="85" y="18" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">TRUNCATED BASELINE (Starts at 80)</text>
    
    <!-- Y-Axis Break Symbol -->
    <path d="M 25 105 L 25 110 L 30 113 L 20 117 L 25 120 L 25 130" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="130" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="end">80</text>
    <text x="18" y="70" fill="#ef4444" font-family="sans-serif" font-size="8" text-anchor="end">100</text>
    
    <rect x="40" y="90" width="35" height="40" fill="#ef4444" opacity="0.8"/>
    <text x="57" y="85" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">A: 85</text>

    <rect x="105" y="40" width="35" height="90" fill="#ef4444" opacity="0.8"/>
    <text x="122" y="35" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">B: 95</text>
    <text x="85" y="135" fill="#ef4444" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">Appears 3× taller!</text>
  </g>

  <!-- Right Side: Fair Zero Axis -->
  <g transform="translate(225, 65)">
    <rect width="170" height="140" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="1"/>
    <text x="85" y="18" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ACCURATE BASELINE (Starts at 0)</text>
    
    <rect x="40" y="55" width="35" height="75" fill="#10b981" opacity="0.8"/>
    <text x="57" y="50" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">85</text>

    <rect x="105" y="47" width="35" height="83" fill="#10b981" opacity="0.8"/>
    <text x="122" y="42" fill="#fff" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">95</text>
    <text x="85" y="135" fill="#10b981" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">True ~11.8% difference</text>
  </g>
</svg>
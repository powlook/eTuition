<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <rect width="100%" height="100%" fill="#0f172a" rx="14" />
  
  <!-- Header Bar -->
  <rect x="16" y="12" width="488" height="32" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="260" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">
    The Real Number System (ℝ) &amp; Subsets Hierarchy
  </text>

  <!-- Real Numbers (R) Universe Box -->
  <rect x="24" y="56" width="472" height="264" rx="10" fill="none" stroke="#38bdf8" stroke-width="2.5" />
  <text x="40" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">ℝ (Real Numbers)</text>

  <!-- Left: Rational Numbers (Q) Big Container -->
  <rect x="36" y="92" width="310" height="216" rx="12" fill="rgba(56, 189, 248, 0.08)" stroke="#38bdf8" stroke-width="2" />
  <text x="48" y="114" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">ℚ (Rational Numbers)</text>
  <text x="48" y="132" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">e.g. ½, -0.75, 0.333...</text>

  <!-- Inside Q: Integers (Z) -->
  <rect x="48" y="144" width="286" height="152" rx="10" fill="rgba(168, 85, 247, 0.12)" stroke="#a855f7" stroke-width="2" />
  <text x="60" y="166" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#c084fc">ℤ (Integers)</text>
  <text x="160" y="166" font-family="system-ui, sans-serif" font-size="11" fill="#e9d5ff">e.g. -7, -15, -3</text>

  <!-- Inside Z: Whole Numbers (W) -->
  <rect x="60" y="178" width="262" height="106" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="2" />
  <text x="72" y="198" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">𝕎 (Whole Numbers)</text>
  <text x="215" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Includes 0</text>

  <!-- Inside W: Natural Numbers (N) -->
  <rect x="72" y="208" width="238" height="64" rx="6" fill="rgba(74, 222, 128, 0.18)" stroke="#4ade80" stroke-width="2" />
  <text x="84" y="230" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#4ade80">ℕ (Natural / Counting Numbers)</text>
  <text x="84" y="252" font-family="system-ui, sans-serif" font-size="12" fill="#86efac">e.g. 1, 2, 3, 4, 5, 12, 100...</text>

  <!-- Right: Irrational Numbers (I) Disjoint Box -->
  <rect x="360" y="92" width="124" height="216" rx="12" fill="rgba(244, 63, 94, 0.12)" stroke="#f43f5e" stroke-width="2" />
  <text x="372" y="118" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fb7185">𝕀 (Irrational)</text>
  <text x="372" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">Disjoint from ℚ</text>
  <text x="372" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f43f5e">e.g. π</text>
  <text x="372" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f43f5e">√2, √3, √5</text>
  <text x="372" y="225" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af">1.41421...</text>
</svg>
  <line x1="40" y1="102" x2="380" y2="102" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Rows -->
  
        <text x="120" y="120" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">6</text>
        <text x="240" y="120" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#f8fafc" text-anchor="middle">1 &nbsp;&nbsp; 4 &nbsp;&nbsp; 8</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="420" height="230" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Banner -->
  <rect x="12" y="12" width="396" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">AREA UNIT CONVERSION (1 m² to cm²)</text>
  <text x="396" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">SI UNIT CONVERSION</text>

  <rect x="20" y="52" width="380" height="155" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Square 1m x 1m grid -->
  <g transform="translate(35, 68)">
    <rect width="90" height="90" rx="4" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="2"/>
    <!-- Internal grid lines -->
    <line x1="30" y1="0" x2="30" y2="90" stroke="rgba(99, 102, 241, 0.3)" stroke-dasharray="2,2"/>
    <line x1="60" y1="0" x2="60" y2="90" stroke="rgba(99, 102, 241, 0.3)" stroke-dasharray="2,2"/>
    <line x1="0" y1="30" x2="90" y2="30" stroke="rgba(99, 102, 241, 0.3)" stroke-dasharray="2,2"/>
    <line x1="0" y1="60" x2="90" y2="60" stroke="rgba(99, 102, 241, 0.3)" stroke-dasharray="2,2"/>
    
    <text x="45" y="-6" fill="#6366f1" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1 m = 100 cm</text>
    <text x="-6" y="48" fill="#6366f1" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">100 cm</text>
    <text x="45" y="50" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">1 m²</text>
  </g>
  
  <!-- Conversion Steps Box -->
  <g transform="translate(150, 68)">
    <rect width="235" height="122" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="#06b6d4" stroke-width="1"/>
    <text x="15" y="24" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="800">Area Multiplier Derivation:</text>
    <text x="15" y="48" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">1 m = 100 cm</text>
    <text x="15" y="70" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">1 m² = (100 cm) × (100 cm)</text>
    <text x="15" y="98" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="800">1 m² = 10,000 cm²</text>
  </g>
</svg>
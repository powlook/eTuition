<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2"/>
  
  <!-- Title -->
  <text x="300" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-size="17" font-weight="700" fill="#f8fafc" text-anchor="middle">Continuous 24-Hour Outdoor Temperature Trend (°C)</text>
  
  <!-- Plot Area Frame -->
  <rect x="70" y="60" width="490" height="200" fill="#1e293b" fill-opacity="0.6" rx="8"/>
  
  <!-- Horizontal Grid lines -->
  <line x1="70" y1="260" x2="560" y2="260" stroke="#334155" stroke-width="1.5"/>
  <line x1="70" y1="210" x2="560" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="160" x2="560" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="110" x2="560" y2="110" stroke="#334155" stroke-width="1" stroke-dasharray="4"/>
  <line x1="70" y1="60" x2="560" y2="60" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Y-Axis Labels -->
  <text x="58" y="264" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">15°C</text>
  <text x="58" y="214" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">20°C</text>
  <text x="58" y="164" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">25°C</text>
  <text x="58" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">30°C</text>
  <text x="58" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="end">35°C</text>
  
  <!-- X-Axis Time Labels -->
  <text x="70" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">00:00</text>
  <text x="151" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">04:00</text>
  <text x="233" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">08:00</text>
  <text x="315" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">12:00</text>
  <text x="396" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">16:00</text>
  <text x="478" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">20:00</text>
  <text x="560" y="282" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">24:00</text>
  
  <!-- Area fill under line -->
  <path d="M 70 230 Q 151 250 233 190 T 315 80 T 396 110 T 478 200 T 560 235 L 560 260 L 70 260 Z" fill="url(#areaGrad)"/>
  
  <!-- Smooth Trendline Path -->
  <path d="M 70 230 Q 151 250 233 190 T 315 80 T 396 110 T 478 200 T 560 235" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Data Points -->
  <circle cx="70" cy="230" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="151" cy="245" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="233" cy="190" r="5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="315" cy="80" r="6" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
  <circle cx="396" cy="110" r="5" fill="#818cf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="478" cy="200" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="560" cy="235" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Peak Temp Annotation -->
  <rect x="270" y="48" width="90" height="24" rx="6" fill="#f43f5e"/>
  <text x="315" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Peak: 33°C (12:00)</text>
  
  <!-- Subtitle -->
  <text x="315" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Time-Series Line Graphs track continuous movement &amp; trends over time</text>
</svg>

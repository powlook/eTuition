  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Grade 9 Topic 154 Diagram #42
  </text>

  <!-- Body Content -->
  
        <g transform="translate(90, 80)">
          <!-- Domain Set X -->
          <ellipse cx="60" cy="110" rx="45" ry="80" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2.5" />

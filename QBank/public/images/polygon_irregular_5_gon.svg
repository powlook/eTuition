<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <!-- Title Badge -->
  <rect x="16" y="16" width="328" height="32" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.3)" />
  <text x="180" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">
    Irregular Pentagon (5 Unequal Sides)
  </text>
  
  <!-- Polygon Outline -->
  <polygon points="180,65 320,110 270,270 80,250 50,140" fill="rgba(245, 158, 11, 0.08)" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Vertices and Labels -->
  <circle cx="180" cy="65" r="4" fill="#f59e0b" />
    <circle cx="320" cy="110" r="4" fill="#f59e0b" />
    <circle cx="270" cy="270" r="4" fill="#f59e0b" />
    <circle cx="80" cy="250" r="4" fill="#f59e0b" />
    <circle cx="50" cy="140" r="4" fill="#f59e0b" />
  <text x="164" y="49" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">A</text>
    <text x="336" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">B</text>
    <text x="286" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">C</text>
    <text x="64" y="266" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">D</text>
    <text x="34" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f59e0b">E</text>
</svg>
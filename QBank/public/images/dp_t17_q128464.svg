<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="440" height="240" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="12" y="12" width="416" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SCATTER PLOT & CORRELATION ANALYSIS</text>
  <text x="416" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">DATA & STATISTICAL ANALYSIS</text>

  <rect x="20" y="52" width="400" height="170" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  <line x1="50" y1="65" x2="50" y2="180" stroke="#475569" stroke-width="1.5"/>
  <line x1="50" y1="180" x2="390" y2="180" stroke="#475569" stroke-width="1.5"/>

  <!-- Points trending upwards -->
  <circle cx="80" cy="160" r="4" fill="#06b6d4"/>
  <circle cx="110" cy="148" r="4" fill="#06b6d4"/>
  <circle cx="140" cy="135" r="4" fill="#06b6d4"/>
  <circle cx="170" cy="120" r="4" fill="#06b6d4"/>
  <circle cx="200" cy="115" r="4" fill="#06b6d4"/>
  <circle cx="230" cy="98" r="4" fill="#06b6d4"/>
  <circle cx="260" cy="85" r="4" fill="#06b6d4"/>
  <circle cx="290" cy="75" r="4" fill="#06b6d4"/>

  <!-- Trend Line -->
  <line x1="70" y1="165" x2="300" y2="70" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="220" y="196" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Positive Correlation Trend Line</text>
</svg>
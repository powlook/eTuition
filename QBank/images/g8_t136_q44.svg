<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="basketballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Cone from Slant Height #44
  </text>

  <!-- Body Content -->
  
      <!-- Base Ellipse -->
      <ellipse cx="240" cy="270" rx="110" ry="32" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" />
      <!-- Slant side -->
      <line x1="130" y1="270" x2="240" y2="80" stroke="#38bdf8" stroke-width="2.5" />
      <line x1="350" y1="270" x2="240" y2="80" stroke="#f59e0b" stroke-width="2.5" />
      <!-- Radius & Height -->
      <line x1="240" y1="270" x2="350" y2="270" stroke="#38bdf8" stroke-width="2" />
      <line x1="240" y1="80" x2="240" y2="270" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
      <!-- Labels -->
      <text x="302" y="170" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">Slant l = 25 cm</text>
      <text x="285" y="292" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">r = 7 cm (d = 14 cm)</text>
      <text x="246" y="175" font-family="sans-serif" font-size="12" fill="#10b981" font-weight="bold">h = 24 cm</text>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="basketballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Recast Sphere to Cone #9
  </text>

  <!-- Body Content -->
  
      <!-- Sphere -->
      <g transform="translate(130, 180)">
        <circle cx="0" cy="0" r="50" fill="url(#sphereGradient)" stroke="#38bdf8" stroke-width="2" />
        <text x="0" y="70" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38bdf8" font-weight="bold">Sphere r = 6 cm</text>
      </g>

      <text x="240" y="180" font-family="sans-serif" font-size="24" fill="#f59e0b" font-weight="bold">➔</text>

      <!-- Recast Cone -->
      <g transform="translate(340, 180)">
        <ellipse cx="0" cy="60" rx="50" ry="16" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2" />
        <line x1="-50" y1="60" x2="0" y2="-60" stroke="#10b981" stroke-width="2" />
        <line x1="50" y1="60" x2="0" y2="-60" stroke="#10b981" stroke-width="2" />
        <line x1="0" y1="-60" x2="0" y2="60" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" />
        <text x="0" y="90" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold">Cone h = 4r = 24 cm</text>
      </g>
    
</svg>
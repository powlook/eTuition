<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="basketballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Basketball Sphere Volume #6
  </text>

  <!-- Body Content -->
  
      <!-- Basketball Sphere -->
      <circle cx="240" cy="200" r="105" fill="url(#basketballGrad)" stroke="#f97316" stroke-width="3" />
      <path d="M 135 200 Q 240 240 345 200" fill="none" stroke="#0f172a" stroke-width="2.5" />
      <path d="M 240 95 Q 280 200 240 305" fill="none" stroke="#0f172a" stroke-width="2.5" />
      <!-- Diameter line -->
      <line x1="135" y1="200" x2="345" y2="200" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
      <!-- Label -->
      <text x="240" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">Diameter d = 24 cm (r = 12 cm)</text>
    
</svg>
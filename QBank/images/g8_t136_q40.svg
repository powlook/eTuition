<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="basketballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Composite Ice Cream Cone Volume #40
  </text>

  <!-- Body Content -->
  
      <g transform="translate(240, 190)">
        <!-- Cone Base Body -->
        <polygon points="-50,-20 50,-20 0,110" fill="rgba(245, 158, 11, 0.3)" stroke="#f59e0b" stroke-width="2" />
        <line x1="0" y1="-20" x2="0" y2="110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
        <!-- Hemispherical Scoop -->
        <path d="M -50 -20 A 50 50 0 0 1 50 -20" fill="rgba(236, 72, 153, 0.4)" stroke="#ec4899" stroke-width="2.5" />
        <!-- Labels -->
        <text x="60" y="-30" font-family="sans-serif" font-size="12" fill="#ec4899" font-weight="bold">Hemisphere r = 3 cm</text>
        <text x="60" y="45" font-family="sans-serif" font-size="12" fill="#f59e0b" font-weight="bold">Cone h = 10 cm</text>
      </g>
    
</svg>
          <path d="M 120 110 L 120 30 A 80 80 0 0 1 200 110 Z" fill="rgba(56, 189, 248, 0.6)" />
          <path d="M 120 110 L 200 110 A 80 80 0 0 1 120 190 Z" fill="rgba(236, 72, 153, 0.6)" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <defs>
    <radialGradient id="sphereGradient" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </radialGradient>
    <radialGradient id="basketballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Exact Sphere Volume #15
  </text>

  <!-- Body Content -->
  
      <!-- 3D Shaded Sphere Circle -->
      <circle cx="240" cy="200" r="100" fill="url(#sphereGradient)" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Equator Ellipse -->
      <ellipse cx="240" cy="200" rx="100" ry="28" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
      <!-- Radius vector -->
      <line x1="240" y1="200" x2="340" y2="200" stroke="#f59e0b" stroke-width="2.5" />
      <circle cx="240" cy="200" r="4" fill="#10b981" />
      <circle cx="340" cy="200" r="4" fill="#f59e0b" />
      <!-- Label -->
      <text x="280" y="190" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">r = 9 cm</text>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Runner Compass Distance #8
  </text>

  <!-- Body Content -->
  
      <g transform="translate(140, 70)">
        <!-- Path North -->
        <line x1="0" y1="200" x2="0" y2="60" stroke="#38bdf8" stroke-width="3" />
        <!-- Path East -->
        <line x1="0" y1="60" x2="180" y2="60" stroke="#38bdf8" stroke-width="3" />
        <!-- Direct Hypotenuse -->
        <line x1="0" y1="200" x2="180" y2="60" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" />
        <!-- Right angle -->
        <rect x="0" y="60" width="18" height="18" fill="none" stroke="#f59e0b" stroke-width="2" />
        <!-- Points & Labels -->
        <circle cx="0" cy="200" r="5" fill="#f59e0b" />
        <text x="-15" y="220" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">Point A</text>
        <circle cx="180" cy="60" r="5" fill="#10b981" />
        <text x="190" y="65" font-family="sans-serif" font-size="13" fill="#10b981" font-weight="bold">Point B</text>

        <text x="-50" y="130" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">North 6 km</text>
        <text x="90" y="45" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">East 8 km</text>
        <text x="100" y="145" font-family="sans-serif" font-size="13" fill="#10b981" font-weight="bold">Direct Distance = ? (10 km)</text>
      </g>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <rect x="20" y="16" width="380" height="36" fill="#1e293b" rx="8"/>
  <text x="210" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">System of Linear Equations</text>
  
  <line x1="60" y1="165" x2="360" y2="165" stroke="#475569" stroke-width="1.5"/>
  <line x1="210" y1="70" x2="210" y2="260" stroke="#475569" stroke-width="1.5"/>
  
  <line x1="90" y1="230" x2="330" y2="90" stroke="#38bdf8" stroke-width="3.5"/>
  <line x1="90" y1="230" x2="330" y2="90" stroke="#f43f5e" stroke-width="2" stroke-dasharray="8,6"/>
  
  <text x="335" y="85" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">L1: 2x - y = 4</text>
  <text x="335" y="105" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">L2: 4x - 2y = 8</text>
</svg>
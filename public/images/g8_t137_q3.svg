<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Converse Pythagorean Check #3
  </text>

  <!-- Body Content -->
  
      <g transform="translate(110, 80)">
        <polygon points="0,200 240,200 20,20" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2.5" />
        <text x="120" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">b = 15 cm</text>
        <text x="-25" y="110" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">a = 8 cm</text>
        <text x="140" y="100" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">c = 17 cm</text>

        <rect x="30" y="240" width="180" height="28" rx="6" fill="rgba(16, 185, 129, 0.9)" />
        <text x="120" y="259" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Right Triangle (c² = a² + b²)</text>
      </g>
    
</svg>
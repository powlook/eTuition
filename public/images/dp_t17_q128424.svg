<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="440" height="240" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="12" y="12" width="416" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">QUARTERLY ENROLLMENT BAR GRAPH</text>
  <text x="416" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">DATA & STATISTICAL ANALYSIS</text>

  <rect x="20" y="52" width="400" height="170" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  <!-- Y-Axis Grid Lines -->
  <line x1="60" y1="70" x2="390" y2="70" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,3"/>
  <text x="50" y="74" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="end">240</text>
  <line x1="60" y1="100" x2="390" y2="100" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,3"/>
  <text x="50" y="104" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="end">180</text>
  <line x1="60" y1="130" x2="390" y2="130" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,3"/>
  <text x="50" y="134" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="end">120</text>
  <line x1="60" y1="160" x2="390" y2="160" stroke="rgba(255,255,255,0.08)" stroke-dasharray="3,3"/>
  <text x="50" y="164" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="end">60</text>
  <line x1="60" y1="185" x2="390" y2="185" stroke="#475569" stroke-width="1.5"/>

  <!-- Bars -->
  <!-- Q1: 120 -->
  <rect x="85" y="130" width="45" height="55" rx="4" fill="url(#cyan-grad)"/>
  <text x="107" y="124" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">120</text>
  <text x="107" y="200" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Q1</text>

  <!-- Q2: 150 -->
  <rect x="160" y="115" width="45" height="70" rx="4" fill="url(#cyan-grad)"/>
  <text x="182" y="109" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">150</text>
  <text x="182" y="200" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Q2</text>

  <!-- Q3: 180 -->
  <rect x="235" y="100" width="45" height="85" rx="4" fill="url(#cyan-grad)"/>
  <text x="257" y="94" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">180</text>
  <text x="257" y="200" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Q3</text>

  <!-- Q4: 210 -->
  <rect x="310" y="85" width="45" height="100" rx="4" fill="url(#amber-grad)"/>
  <text x="332" y="79" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">210</text>
  <text x="332" y="200" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Q4</text>
</svg>
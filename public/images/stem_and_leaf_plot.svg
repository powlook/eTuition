<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Title -->
  <text x="300" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">Stem-and-Leaf Plot Representation</text>
  
  <!-- Main Table Frame -->
  <rect x="80" y="65" width="440" height="185" rx="12" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1.5"/>
  
  <!-- Header Bar -->
  <rect x="80" y="65" width="440" height="42" rx="12" fill="url(#headerGrad)"/>
  <rect x="80" y="95" width="440" height="12" fill="url(#headerGrad)"/>
  <text x="170" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">STEM (Tens)</text>
  <text x="360" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">LEAF (Units)</text>
  
  <!-- Vertical Divider Bar -->
  <line x1="250" y1="65" x2="250" y2="250" stroke="#6366f1" stroke-width="3" stroke-dasharray="0"/>
  
  <!-- Row 1: Stem 4 -->
  <text x="170" y="142" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">4</text>
  <text x="280" y="142" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#f1f5f9">2  5</text>
  <line x1="80" y1="160" x2="520" y2="160" stroke="#334155" stroke-width="1"/>
  
  <!-- Row 2: Stem 5 -->
  <text x="170" y="192" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">5</text>
  <text x="280" y="192" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#a7f3d0">1  3  8</text>
  <line x1="80" y1="210" x2="520" y2="210" stroke="#334155" stroke-width="1"/>
  
  <!-- Row 3: Stem 6 -->
  <text x="170" y="240" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#38bdf8" text-anchor="middle">6</text>
  <text x="280" y="240" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600" fill="#fde047">0  4  7</text>
  
  <!-- Key Box -->
  <rect x="180" y="268" width="240" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
  <text x="300" y="291" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">&lt;tspan fill="#38bdf8" font-weight="700"&gt;KEY:&lt;/tspan&gt; 5 | 2 = 52 test score points</text>
</svg>

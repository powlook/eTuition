<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="420" height="230" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Banner -->
  <rect x="12" y="12" width="396" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">AUTOMOTIVE FUEL FLOW (r = 40 mL/s)</text>
  <text x="396" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">SI UNIT CONVERSION</text>

  <rect x="20" y="52" width="380" height="155" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Fuel Meter Graphic -->
  <g transform="translate(35, 70)">
    <rect x="0" y="10" width="115" height="60" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="57" y="32" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Fuel Consumption</text>
    <text x="57" y="52" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">40 mL/s</text>
    <text x="57" y="90" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Target unit: L/h</text>
  </g>

  <!-- Flow Formula Card -->
  <g transform="translate(170, 68)">
    <rect width="215" height="122" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="#f59e0b" stroke-width="1"/>
    <text x="14" y="24" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="800">Fuel Rate Multiplier Rule:</text>
    <text x="14" y="48" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">1 mL/s = 3.6 Liters / hour</text>
    <text x="14" y="74" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="700">Rate (L/h) = 40 × 3.6</text>
    <text x="14" y="98" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="600">Automotive Engine Fuel Metric</text>
  </g>
</svg>
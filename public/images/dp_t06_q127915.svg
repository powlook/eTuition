<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="420" height="230" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Banner -->
  <rect x="12" y="12" width="396" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SPRINT SPEED CONVERSION (t = 10.5 s)</text>
  <text x="396" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">SI UNIT CONVERSION</text>

  <rect x="20" y="52" width="380" height="155" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Track Lane Graphic -->
  <rect x="35" y="68" width="350" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="35" y1="92" x2="385" y2="92" stroke="rgba(245, 158, 11, 0.6)" stroke-width="2"/>
  
  <!-- Start & Finish Markers -->
  <circle cx="55" cy="92" r="8" fill="#10b981"/>
  <text x="55" y="96" fill="#fff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">S</text>
  
  <line x1="345" y1="74" x2="345" y2="110" stroke="#ef4444" stroke-width="3"/>
  <text x="345" y="66" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">FINISH</text>
  
  <!-- Distance & Time Annotation -->
  <text x="200" y="85" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">Distance d = 100 m</text>
  <text x="200" y="106" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Sprint Time t = 10.5 s</text>
  
  <!-- Conversion Formula Box -->
  <rect x="35" y="130" width="350" height="60" rx="6" fill="rgba(0, 0, 0, 0.35)" stroke="#06b6d4" stroke-width="1"/>
  <text x="45" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Speed Unit Transformation Formula:</text>
  <text x="45" y="173" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700">v (km/h) = [ Distance (m) / Time (s) ] × 3.6</text>
</svg>
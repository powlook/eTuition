<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Rectangle Diagonal #7
  </text>

  <!-- Body Content -->
  
      <g transform="translate(110, 90)">
        <rect x="0" y="0" width="260" height="180" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="2" />
        <line x1="0" y1="180" x2="260" y2="0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" />
        <text x="130" y="202" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">Width = 16 cm</text>
        <text x="-40" y="95" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="bold">Height = 12 cm</text>
        <text x="130" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#10b981" font-weight="bold">Diagonal = 20 cm</text>
      </g>
    
</svg>
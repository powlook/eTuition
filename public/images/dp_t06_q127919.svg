<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="420" height="230" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Banner -->
  <rect x="12" y="12" width="396" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">HIGH-SPEED TRAIN VELOCITY (v = 180 km/h)</text>
  <text x="396" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">SI UNIT CONVERSION</text>

  <rect x="20" y="52" width="380" height="155" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Bullet Train Vector Shape -->
  <g transform="translate(35, 72)">
    <path d="M 0 35 L 30 10 L 120 10 C 150 10 170 25 180 35 L 0 35 Z" fill="url(#cyan-grad)"/>
    <rect x="0" y="35" width="180" height="10" fill="#1e293b"/>
    <circle cx="40" cy="22" r="4" fill="#fff"/>
    <circle cx="65" cy="22" r="4" fill="#fff"/>
    <circle cx="90" cy="22" r="4" fill="#fff"/>
    <text x="90" y="58" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">Speed v = 180 km/h</text>
  </g>

  <!-- Speedometer / Conversion Rule Box -->
  <g transform="translate(230, 68)">
    <rect width="155" height="122" rx="8" fill="rgba(0, 0, 0, 0.35)" stroke="#06b6d4" stroke-width="1"/>
    <text x="12" y="24" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="800">Conversion Rule:</text>
    <text x="12" y="48" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">1 km/h = (1/3.6) m/s</text>
    <text x="12" y="75" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="700">v (m/s) = v (km/h) ÷ 3.6</text>
    <text x="12" y="102" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">Target unit: m/s</text>
  </g>
</svg>
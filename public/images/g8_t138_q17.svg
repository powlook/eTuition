<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <rect width="100%" height="100%" fill="#0f172a" rx="12"/>
  <rect x="20" y="16" width="380" height="36" fill="#1e293b" rx="8"/>
  <text x="210" y="40" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Exterior Angle Diagram</text>
  
  <!-- Triangle -->
  <polygon points="100,220 260,220 160,90" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>

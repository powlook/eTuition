<?xml version="1.0" encoding="UTF-8"?>
<svg width="480" height="320" viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" />
  <g transform="translate(90, 20)">
          <!-- Rectangle -->
          <rect x="50" y="90" width="160" height="90" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="3" />
          <!-- Semicircle Top -->
          <path d="M 50,90 A 80 80 0 0 1 210,90 Z" fill="rgba(236, 72, 153, 0.3)" stroke="#ec4899" stroke-width="3" />
          
          <text x="130" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">Rectangle (14 &#215; 8 cm)</text>
          <text x="130" y="65" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ec4899" font-weight="bold">Semicircle (r = 7 cm)</text>

          <text x="130" y="210" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">Total Area = Rect Area + Semicircle Area</text>
          <text x="130" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#10b981" font-weight="bold">= (14 &#215; 8) + (&#189; &#215; 3.14 &#215; 7&#178;) &#8776; 188.93 cm&#178;</text>
        </g>
      
</svg>
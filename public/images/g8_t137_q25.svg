<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380">
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />

  <!-- Header Title -->
  <rect x="16" y="12" width="448" height="28" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" />
  <text x="240" y="31" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">
    Rescue Ladder Distance #25
  </text>

  <!-- Body Content -->
  
      <!-- Wall & Ground -->
      <line x1="140" y1="60" x2="140" y2="280" stroke="#94a3b8" stroke-width="4" />
      <line x1="140" y1="280" x2="340" y2="280" stroke="#94a3b8" stroke-width="4" />
      <!-- Ladder -->
      <line x1="140" y1="100" x2="280" y2="280" stroke="#f59e0b" stroke-width="5" />
      <line x1="140" y1="100" x2="280" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6" />
      <!-- Right angle -->
      <rect x="140" y="260" width="20" height="20" fill="none" stroke="#10b981" stroke-width="2" />
      <!-- Labels -->
      <text x="90" y="190" font-family="sans-serif" font-size="13" fill="#38bdf8" font-weight="bold">Wall = 12 m</text>
      <text x="210" y="302" font-family="sans-serif" font-size="13" fill="#10b981" font-weight="bold">Ground = ? (9 m)</text>
      <text x="225" y="175" font-family="sans-serif" font-size="13" fill="#f59e0b" font-weight="bold">Ladder = 15 m</text>
    
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <rect width="440" height="240" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <rect x="12" y="12" width="416" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">PIE CHART: DISTRIBUTION ANALYSIS</text>
  <text x="416" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">DATA & STATISTICAL ANALYSIS</text>

  <rect x="20" y="52" width="400" height="170" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  <g transform="translate(130, 137)">
    <!-- Sector 1: 135 deg (Food / Walk) -->
    <path d="M 0 0 L 70 0 A 70 70 0 0 1 -49.5 49.5 Z" fill="#06b6d4" opacity="0.9"/>
    <!-- Sector 2: 126 deg (Jeepney / Red) -->
    <path d="M 0 0 L -49.5 49.5 A 70 70 0 0 1 -56.6 -41.1 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Sector 3: 54 deg -->
    <path d="M 0 0 L -56.6 -41.1 A 70 70 0 0 1 0 -70 Z" fill="#a855f7" opacity="0.9"/>
    <!-- Sector 4: 45 deg -->
    <path d="M 0 0 L 0 -70 A 70 70 0 0 1 70 0 Z" fill="#10b981" opacity="0.9"/>
  </g>

  <!-- Legend Card -->
  <g transform="translate(250, 75)">
    <rect width="150" height="120" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)"/>
    <rect x="15" y="15" width="12" height="12" rx="3" fill="#06b6d4"/>
    <text x="35" y="25" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Category A / Food</text>

    <rect x="15" y="40" width="12" height="12" rx="3" fill="#f59e0b"/>
    <text x="35" y="50" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Category B / Jeepney</text>

    <rect x="15" y="65" width="12" height="12" rx="3" fill="#a855f7"/>
    <text x="35" y="75" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Category C</text>

    <rect x="15" y="90" width="12" height="12" rx="3" fill="#10b981"/>
    <text x="35" y="100" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="600">Category D</text>
  </g>
</svg>
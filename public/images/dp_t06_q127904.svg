<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="420" height="230" rx="14" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Header Banner -->
  <rect x="12" y="12" width="396" height="28" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.08)"/>
  <text x="24" y="30" fill="#06b6d4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">LENGTH CONVERSION SCALE (L = 3.01 km)</text>
  <text x="396" y="30" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" text-anchor="end">SI UNIT CONVERSION</text>

  <!-- Main Diagram Container -->
  <rect x="20" y="52" width="380" height="155" rx="10" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.08)"/>
  
  <!-- Conversion Ladder / Multi-Stage Scale -->
  <!-- Kilometers Box -->
  <g transform="translate(35, 75)">
    <rect width="70" height="42" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="35" y="20" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">3.01 km</text>
    <text x="35" y="34" fill="#06b6d4" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Kilometers</text>
  </g>
  
  <!-- Arrow 1: km -> m -->
  <path d="M 110 96 L 138 96" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="124" y="90" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">×1,000</text>

  <!-- Meters Box -->
  <g transform="translate(142, 75)">
    <rect width="65" height="42" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="32" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">? m</text>
    <text x="32" y="34" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Meters</text>
  </g>

  <!-- Arrow 2: m -> cm -->
  <path d="M 212 96 L 238 96" stroke="#10b981" stroke-width="2"/>
  <text x="225" y="90" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">×100</text>

  <!-- Centimeters Box -->
  <g transform="translate(242, 75)">
    <rect width="65" height="42" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">? cm</text>
    <text x="32" y="34" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Centimeters</text>
  </g>

  <!-- Arrow 3: cm -> mm -->
  <path d="M 312 96 L 338 96" stroke="#a855f7" stroke-width="2"/>
  <text x="325" y="90" fill="#a855f7" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">×10</text>

  <!-- Millimeters Box -->
  <g transform="translate(342, 75)">
    <rect width="45" height="42" rx="8" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="22" y="20" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">? mm</text>
    <text x="22" y="34" fill="#a855f7" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">mm</text>
  </g>

  <!-- Unit Step Relations -->
  <rect x="35" y="135" width="352" height="55" rx="6" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.05)"/>
  <text x="45" y="153" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Metric Length Multipliers:</text>
  <text x="45" y="174" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="700">1 km = 1,000 m = 100,000 cm = 1,000,000 mm</text>
</svg>